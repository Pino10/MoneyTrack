name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Use the newest Xcode available
        run: |
          NEWEST=$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$NEWEST" ]; then sudo xcode-select -s "$NEWEST/Contents/Developer"; fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Save the Xcode project to the repository
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add -f MoneyTrack.xcodeproj MoneyTrack/Info.plist
          if ! git diff --cached --quiet; then
            git commit -m "Update generated Xcode project [skip ci]"
            git push origin HEAD:main
          fi

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project MoneyTrack.xcodeproj \
            -scheme MoneyTrack \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build 2>&1 | tail -n 60

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/MoneyTrack.app Payload/
          zip -qry MoneyTrack.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: MoneyTrack-ipa
          path: MoneyTrack.ipa

      - name: Publish the latest IPA as a release
        if: github.event_name != 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: MoneyTrack latest build
          body: Unsigned IPA built from the newest commit. Install it with Sideloadly, AltStore or SideStore.
          make_latest: true
          files: MoneyTrack.ipa

      - name: Attach to a published release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: MoneyTrack.ipa
